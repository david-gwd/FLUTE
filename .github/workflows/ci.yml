name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # weekly: also runs the slow end-to-end tests

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, cxx: g++, werror: "OFF"}
          - {os: ubuntu-latest, cc: clang, cxx: clang++, werror: "ON"}
          - {os: macos-latest, cc: clang, cxx: clang++, werror: "ON"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DFLUTE_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -LE slow --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFLUTE_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build -LE slow --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==18.1.8
      - run: clang-format --dry-run --Werror include/flute/*.hpp src/*.cpp apps/*.cpp tests/*.cpp tests/*.hpp

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build -L slow --output-on-failure
